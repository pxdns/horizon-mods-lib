# Releases the SearchStats native mod (search-stats/) as search_stats-<version>.hnmod.
#
# Bump `version` in mods/search-stats/mixins/search_stats/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `search-stats-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release search-stats

on:
  push:
    branches: [main]
    paths:
      - "mods/search-stats/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-search-stats.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: search-stats
      publish: ${{ github.event_name == 'push' || inputs.publish }}
