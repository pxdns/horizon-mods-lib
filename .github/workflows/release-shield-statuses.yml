# Releases the Shield Statuses native mod (shield-statuses/) as shield_statuses-<version>.hnmod.
#
# Bump `version` in mods/shield-statuses/mixins/shield_statuses/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `shield-statuses-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release shield-statuses

on:
  push:
    branches: [main]
    paths:
      - "mods/shield-statuses/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-shield-statuses.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: shield-statuses
      publish: ${{ github.event_name == 'push' || inputs.publish }}
