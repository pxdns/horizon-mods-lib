# Releases the BetterHurtCam native mod (better-hurt-cam/) as better_hurt_cam-<version>.hnmod.
#
# Bump `version` in mods/better-hurt-cam/mixins/better_hurt_cam/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `better-hurt-cam-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release better-hurt-cam

on:
  push:
    branches: [main]
    paths:
      - "mods/better-hurt-cam/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-better-hurt-cam.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: better-hurt-cam
      publish: ${{ github.event_name == 'push' || inputs.publish }}
