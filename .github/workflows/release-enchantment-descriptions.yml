# Releases the Enchantment Descriptions native mod (enchantment-descriptions/) as enchantment_descriptions-<version>.hnmod.
#
# Bump `version` in mods/enchantment-descriptions/mixins/enchantment_descriptions/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `enchantment-descriptions-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release enchantment-descriptions

on:
  push:
    branches: [main]
    paths:
      - "mods/enchantment-descriptions/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-enchantment-descriptions.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: enchantment-descriptions
      publish: ${{ github.event_name == 'push' || inputs.publish }}
