# Releases the Clumps native mod (clumps/) as clumps-<version>.hnmod.
#
# Bump `version` in mods/clumps/mixins/clumps/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `clumps-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release clumps

on:
  push:
    branches: [main]
    paths:
      - "mods/clumps/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-clumps.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: clumps
      publish: ${{ github.event_name == 'push' || inputs.publish }}
