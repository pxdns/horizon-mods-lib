# Releases the BetterGrassify native mod (bettergrassify/) as bettergrassify-<version>.hnmod.
#
# Bump `version` in mods/bettergrassify/mixins/bettergrassify/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `bettergrassify-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release bettergrassify

on:
  push:
    branches: [main]
    paths:
      - "mods/bettergrassify/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-bettergrassify.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: bettergrassify
      publish: ${{ github.event_name == 'push' || inputs.publish }}
