# Releases the VisualKeys native mod (visual-keys/) as visual_keys-<version>.hnmod.
#
# Bump `version` in mods/visual-keys/mixins/visual_keys/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `visual-keys-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release visual-keys

on:
  push:
    branches: [main]
    paths:
      - "mods/visual-keys/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-visual-keys.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: visual-keys
      publish: ${{ github.event_name == 'push' || inputs.publish }}
