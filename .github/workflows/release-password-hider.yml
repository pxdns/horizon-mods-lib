# Releases the Password Hider native mod (password-hider/) as password_hider-<version>.hnmod.
#
# Bump `version` in mods/password-hider/mixins/password_hider/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `password-hider-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release password-hider

on:
  push:
    branches: [main]
    paths:
      - "mods/password-hider/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-password-hider.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: password-hider
      publish: ${{ github.event_name == 'push' || inputs.publish }}
