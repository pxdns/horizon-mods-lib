# Releases the Effect Timer native mod (effect-timer/) as effect_timer-<version>.hnmod.
#
# Bump `version` in mods/effect-timer/mixins/effect_timer/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `effect-timer-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release effect-timer

on:
  push:
    branches: [main]
    paths:
      - "mods/effect-timer/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-effect-timer.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: effect-timer
      publish: ${{ github.event_name == 'push' || inputs.publish }}
