# Releases the InvMove native mod (invmove/) as invmove-<version>.hnmod.
#
# Bump `version` in mods/invmove/mixins/invmove/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `invmove-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release invmove

on:
  push:
    branches: [main]
    paths:
      - "mods/invmove/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-invmove.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: invmove
      publish: ${{ github.event_name == 'push' || inputs.publish }}
