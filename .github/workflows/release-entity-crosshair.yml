# Releases the Entity Crosshair native mod (entity-crosshair/) as entity_crosshair-<version>.hnmod.
#
# Bump `version` in mods/entity-crosshair/mixins/entity_crosshair/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `entity-crosshair-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release entity-crosshair

on:
  push:
    branches: [main]
    paths:
      - "mods/entity-crosshair/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-entity-crosshair.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: entity-crosshair
      publish: ${{ github.event_name == 'push' || inputs.publish }}
