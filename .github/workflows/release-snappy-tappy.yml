# Releases the Snappy Tappy native mod (snappy-tappy/) as snappy_tappy-<version>.hnmod.
#
# Bump `version` in mods/snappy-tappy/mixins/snappy_tappy/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `snappy-tappy-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release snappy-tappy

on:
  push:
    branches: [main]
    paths:
      - "mods/snappy-tappy/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-snappy-tappy.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: snappy-tappy
      publish: ${{ github.event_name == 'push' || inputs.publish }}
