# Releases the Crafting Tweaks native mod (crafting-tweaks/) as crafting_tweaks-<version>.hnmod.
#
# Bump `version` in mods/crafting-tweaks/mixins/crafting_tweaks/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `crafting-tweaks-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release crafting-tweaks

on:
  push:
    branches: [main]
    paths:
      - "mods/crafting-tweaks/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-crafting-tweaks.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: crafting-tweaks
      publish: ${{ github.event_name == 'push' || inputs.publish }}
