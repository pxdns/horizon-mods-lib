# Releases the Durability Tooltip native mod (durability-tooltip/) as durability_tooltip-<version>.hnmod.
#
# Bump `version` in mods/durability-tooltip/mixins/durability_tooltip/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `durability-tooltip-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release durability-tooltip

on:
  push:
    branches: [main]
    paths:
      - "mods/durability-tooltip/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-durability-tooltip.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: durability-tooltip
      publish: ${{ github.event_name == 'push' || inputs.publish }}
