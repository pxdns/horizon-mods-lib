# Releases the Zoomify native mod (zoomify/) as zoomify-<version>.hnmod.
#
# Bump `version` in mods/zoomify/mixins/zoomify/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `zoomify-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release zoomify

on:
  push:
    branches: [main]
    paths:
      - "mods/zoomify/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-zoomify.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: zoomify
      publish: ${{ github.event_name == 'push' || inputs.publish }}
