# Releases the Sprint Indicator native mod (sprint-indicator/) as sprint_indicator-<version>.hnmod.
#
# Bump `version` in mods/sprint-indicator/mixins/sprint_indicator/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `sprint-indicator-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release sprint-indicator

on:
  push:
    branches: [main]
    paths:
      - "mods/sprint-indicator/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-sprint-indicator.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: sprint-indicator
      publish: ${{ github.event_name == 'push' || inputs.publish }}
