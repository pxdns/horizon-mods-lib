# Releases the Simple Zoom native mod (simple-zoom/) as simple_zoom-<version>.hnmod.
#
# Bump `version` in mods/simple-zoom/mixins/simple_zoom/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `simple-zoom-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release simple-zoom

on:
  push:
    branches: [main]
    paths:
      - "mods/simple-zoom/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-simple-zoom.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: simple-zoom
      publish: ${{ github.event_name == 'push' || inputs.publish }}
