# Releases the Shulker Box Tooltip native mod (shulker-box-tooltip/) as shulker_box_tooltip-<version>.hnmod.
#
# Bump `version` in mods/shulker-box-tooltip/mixins/shulker_box_tooltip/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `shulker-box-tooltip-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release shulker-box-tooltip

on:
  push:
    branches: [main]
    paths:
      - "mods/shulker-box-tooltip/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-shulker-box-tooltip.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: shulker-box-tooltip
      publish: ${{ github.event_name == 'push' || inputs.publish }}
