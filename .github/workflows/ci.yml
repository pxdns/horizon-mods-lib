name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [fps-display, sprint-indicator, key-overlay, cps-counter, info-hud, custom-hud, zoomify, simple-zoom, waypoints, armor-hud, potion-counter, totem-counter, effect-timer, apple-skin, pick-up-notifier, freelook, freecam, snappy-tappy, better-hurt-cam, more-chat-history, chat-notify, chat-animation, durability-tooltip, crosshair-indicator, entity-crosshair, shulker-box-tooltip, combat-hitboxes, ping-view, invmove, better-mount-hud, minimap-plus, password-hider, enchantment-descriptions, f5-split, shield-statuses, chat-patches, clumps, search-stats, better-stats, item-highlighter, crafting-tweaks, visual-keys, crystal-optimizer, chat-heads, controlling, multi-key-bindings, pearl-optimizer, bettergrassify, entity-texture-features, litematica]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format, lint and test the mod's logic
        working-directory: mods/${{ matrix.mod }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: The bundle packages
        run: python3 tools/mods.py package "${{ matrix.mod }}"

  on-horizon:
    # Applies every mod together on the pinned Horizon and type-checks the game, as the launcher builds a player's set.
    runs-on: ubuntu-latest
    needs: logic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: System libraries the game's crates link
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config
      - name: Apply all mods on Horizon and cargo check
        run: python3 tools/mods.py check all
      - name: The all-in-one bundle builds
        run: python3 tools/mods.py bundle all

  reproducible:
    # Regenerates every generated file from this repository alone and fails if anything differs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Rust and the site builder's one dependency
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          pip install markdown
      - run: python3 tools/gen/regen.py
      - name: Nothing changed
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::Generated files are out of date, run python3 tools/gen/regen.py and commit"
            exit 1
          fi
