# Releases the Ping View native mod (ping-view/) as ping_view-<version>.hnmod.
#
# Bump `version` in mods/ping-view/mixins/ping_view/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `ping-view-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release ping-view

on:
  push:
    branches: [main]
    paths:
      - "mods/ping-view/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-ping-view.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: ping-view
      publish: ${{ github.event_name == 'push' || inputs.publish }}
