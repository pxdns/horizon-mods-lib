# Releases the Minimap Plus native mod (minimap-plus/) as minimap_plus-<version>.hnmod.
#
# Bump `version` in mods/minimap-plus/mixins/minimap_plus/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `minimap-plus-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release minimap-plus

on:
  push:
    branches: [main]
    paths:
      - "mods/minimap-plus/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-minimap-plus.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: minimap-plus
      publish: ${{ github.event_name == 'push' || inputs.publish }}
