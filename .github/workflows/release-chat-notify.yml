# Releases the Chat Notify native mod (chat-notify/) as chat_notify-<version>.hnmod.
#
# Bump `version` in mods/chat-notify/mixins/chat_notify/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `chat-notify-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release chat-notify

on:
  push:
    branches: [main]
    paths:
      - "mods/chat-notify/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-chat-notify.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: chat-notify
      publish: ${{ github.event_name == 'push' || inputs.publish }}
