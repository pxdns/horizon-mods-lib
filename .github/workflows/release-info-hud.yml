# Releases the Info HUD native mod (info-hud/) as info_hud-<version>.hnmod.
#
# Bump `version` in mods/info-hud/mixins/info_hud/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `info-hud-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release info-hud

on:
  push:
    branches: [main]
    paths:
      - "mods/info-hud/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-info-hud.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: info-hud
      publish: ${{ github.event_name == 'push' || inputs.publish }}
