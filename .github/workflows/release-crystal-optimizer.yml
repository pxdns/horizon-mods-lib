# Releases the Crystal Optimizer native mod (crystal-optimizer/) as crystal_optimizer-<version>.hnmod.
#
# Bump `version` in mods/crystal-optimizer/mixins/crystal_optimizer/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `crystal-optimizer-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release crystal-optimizer

on:
  push:
    branches: [main]
    paths:
      - "mods/crystal-optimizer/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-crystal-optimizer.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: crystal-optimizer
      publish: ${{ github.event_name == 'push' || inputs.publish }}
