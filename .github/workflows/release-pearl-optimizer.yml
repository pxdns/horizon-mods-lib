# Releases the Pearl Optimizer native mod (pearl-optimizer/) as pearl_optimizer-<version>.hnmod.
#
# Bump `version` in mods/pearl-optimizer/mixins/pearl_optimizer/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `pearl-optimizer-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release pearl-optimizer

on:
  push:
    branches: [main]
    paths:
      - "mods/pearl-optimizer/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-pearl-optimizer.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: pearl-optimizer
      publish: ${{ github.event_name == 'push' || inputs.publish }}
