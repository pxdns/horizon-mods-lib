# Releases the Pick Up Notifier native mod (pick-up-notifier/) as pick_up_notifier-<version>.hnmod.
#
# Bump `version` in mods/pick-up-notifier/mixins/pick_up_notifier/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `pick-up-notifier-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release pick-up-notifier

on:
  push:
    branches: [main]
    paths:
      - "mods/pick-up-notifier/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-pick-up-notifier.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: pick-up-notifier
      publish: ${{ github.event_name == 'push' || inputs.publish }}
