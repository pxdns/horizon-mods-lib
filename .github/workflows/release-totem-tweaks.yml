# Releases the Totem Tweaks native mod (totem-tweaks/) as totem_tweaks-<version>.hnmod.
#
# Bump `version` in mods/totem-tweaks/mixins/totem_tweaks/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `totem-tweaks-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release totem-tweaks

on:
  push:
    branches: [main]
    paths:
      - "mods/totem-tweaks/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-totem-tweaks.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: totem-tweaks
      publish: ${{ github.event_name == 'push' || inputs.publish }}
