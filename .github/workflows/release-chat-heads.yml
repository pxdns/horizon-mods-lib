# Releases the Chat Heads native mod (chat-heads/) as chat_heads-<version>.hnmod.
#
# Bump `version` in mods/chat-heads/mixins/chat_heads/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `chat-heads-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release chat-heads

on:
  push:
    branches: [main]
    paths:
      - "mods/chat-heads/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-chat-heads.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: chat-heads
      publish: ${{ github.event_name == 'push' || inputs.publish }}
