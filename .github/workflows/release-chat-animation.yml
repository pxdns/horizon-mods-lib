# Releases the Chat Animation native mod (chat-animation/) as chat_animation-<version>.hnmod.
#
# Bump `version` in mods/chat-animation/mixins/chat_animation/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `chat-animation-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release chat-animation

on:
  push:
    branches: [main]
    paths:
      - "mods/chat-animation/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-chat-animation.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: chat-animation
      publish: ${{ github.event_name == 'push' || inputs.publish }}
