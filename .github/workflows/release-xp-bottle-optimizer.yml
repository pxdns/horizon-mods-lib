# Releases the XP Bottle Optimizer native mod (xp-bottle-optimizer/) as xp_bottle_optimizer-<version>.hnmod.
#
# Bump `version` in mods/xp-bottle-optimizer/mixins/xp_bottle_optimizer/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `xp-bottle-optimizer-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release xp-bottle-optimizer

on:
  push:
    branches: [main]
    paths:
      - "mods/xp-bottle-optimizer/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-xp-bottle-optimizer.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: xp-bottle-optimizer
      publish: ${{ github.event_name == 'push' || inputs.publish }}
