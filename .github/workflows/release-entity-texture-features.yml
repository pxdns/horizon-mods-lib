# Releases the Entity Texture Features native mod (entity-texture-features/) as entity_texture_features-<version>.hnmod.
#
# Bump `version` in mods/entity-texture-features/mixins/entity_texture_features/horizon-mixin.toml and push to main: the mod is tested, packaged, and a
# GitHub release `entity-texture-features-v<version>` is created with the .hnmod and its SHA-256. Nothing is released when that tag already
# exists, so ordinary pushes are free. Run it by hand from the Actions tab to test and package without releasing.
name: release entity-texture-features

on:
  push:
    branches: [main]
    paths:
      - "mods/entity-texture-features/**"
      - "tools/mods.py"
      - ".github/workflows/_release.yml"
      - ".github/workflows/release-entity-texture-features.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the release even from a manual run"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release.yml
    with:
      slug: entity-texture-features
      publish: ${{ github.event_name == 'push' || inputs.publish }}
