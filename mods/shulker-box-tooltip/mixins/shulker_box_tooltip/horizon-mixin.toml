[mod]
id = "shulker_box_tooltip"
version = "1.0.0"
priority = 100

# The commit it was tested on. It hooks functions that are not Horizon's stable hook points, so it only builds on this commit.
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-items/src/bundle.rs"
name = "lib_shulker_box_tooltip"
source = "runtime.rs"
visibility = "pub"

[[injection]]
id = "tooltip"
kind = "RETURN"
target = "horizon_client::game::stations::Game<'_>::stack_tooltip"
helper = "tooltip.rs"
bindings = [
  { name = "lines", ty = "Vec<(horizon_client::text::Text, u32)>", value = "$value" },
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
]

[[injection]]
id = "bundle"
kind = "HEAD"
cancellable = true
target = "horizon_items::bundle::tooltip_layout"
helper = "bundle.rs"
bindings = [
  { name = "items", ty = "&Items", value = "items" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
  { name = "box_width", ty = "f32", value = "box_width" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
