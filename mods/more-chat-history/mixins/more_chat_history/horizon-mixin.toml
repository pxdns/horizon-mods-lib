[mod]
id = "more_chat_history"
version = "1.0.0"
priority = 100

# The commit it was tested on. It hooks functions that are not Horizon's stable hook points, so it only builds on this commit.
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/chat.rs"
name = "lib_more_chat_history"
source = "runtime.rs"
visibility = "pub"

[[injection]]
id = "add"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::chat::Chat::add_message"
helper = "add.rs"
bindings = [
  { name = "chat", ty = "&mut Chat", value = "&mut *self" },
  { name = "font", ty = "&crate::font::Font", value = "font" },
  { name = "content", ty = "&Text", value = "&content" },
  { name = "indicator", ty = "Option<u32>", value = "indicator" },
  { name = "source", ty = "ChatSource", value = "source" },
  { name = "ticks", ty = "u64", value = "ticks" },
  { name = "focused", ty = "bool", value = "focused" },
]

[[injection]]
id = "lines"
kind = "MODIFY_CONSTANT"
target = "horizon_client_render::chat::Chat::add_lines"
selector = "100"
require = 1
ordinal = 0
helper = "lines.rs"
bindings = [
  { name = "value", ty = "usize", value = "$value" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
