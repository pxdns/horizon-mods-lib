[mod]
id = "crystal_optimizer"
version = "1.0.0"
priority = 100

# The commit it was tested on. It hooks functions that are not Horizon's stable hook points, so it only builds on this commit.
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game/remote.rs"
name = "lib_crystal_optimizer"
source = "runtime.rs"

[[injection]]
id = "send"
kind = "HEAD"
target = "horizon_client::game::remote::Game<'_>::send"
helper = "send.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "packet", ty = "&S", value = "&packet" },
]

[[injection]]
id = "gone"
kind = "HEAD"
target = "horizon_client::game::remote_projectiles::Game<'_>::remove_remote_projectile"
helper = "gone.rs"
bindings = [
  { name = "id", ty = "u32", value = "id" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
