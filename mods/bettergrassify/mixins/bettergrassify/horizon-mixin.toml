[mod]
id = "better_grassify"
version = "1.0.0"
priority = 100

# The commit it was tested on. It hooks functions that are not Horizon's stable hook points, so it only builds on this commit.
[compatibility]
horizon_revision = "ba6344a59cb9e755b730dcf02285fc0d33b97d3c"

[[module]]
id = "runtime"
file = "crates/horizon-client-render/src/mesher.rs"
name = "lib_better_grassify"
source = "runtime.rs"
visibility = "pub"

[[injection]]
id = "face"
kind = "HEAD"
cancellable = true
target = "horizon_client_render::mesher::Mesher<'_>::face"
helper = "face.rs"
bindings = [
  { name = "mesher", ty = "&Mesher<'_>", value = "&*self" },
  { name = "pad", ty = "&Padded", value = "pad" },
  { name = "tints", ty = "&mut Tints<'_>", value = "tints" },
  { name = "out", ty = "&mut SectionMesh", value = "out" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "origin", ty = "[f32; 3]", value = "origin" },
  { name = "face", ty = "&BakedFace", value = "face" },
  { name = "ao", ty = "bool", value = "ao" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "click"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]
